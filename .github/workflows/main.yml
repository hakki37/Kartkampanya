name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.32.8'
          cache: true

      - name: Create Android project
        run: flutter create --platforms=android .

      - name: Apply v11 UI patch
        run: |
          git apply --check -p0 ui-theme-v11.patch
          git apply -p0 ui-theme-v11.patch

      - name: Apply v12 UI polish
        run: python3 scripts/apply-v12-ui.py

      - name: Apply v13 UI fix
        run: python3 scripts/fix-v13-ui.py

      - name: Apply v13 brand logos
        run: python3 scripts/apply-v13-brand-logos.py

      - name: Apply v14 final catalog UI
        run: python3 scripts/apply-v14-final.py

      - name: Fix v14 generated Dart syntax
        run: python3 scripts/fix-v14-syntax.py

      - name: Fix benefit display
        run: python3 scripts/fix-benefit-display.py

      - name: Apply v15 exact catalog UI
        run: python3 scripts/apply-v15-catalog-ui.py

      - name: Fix v15 generated Dart syntax
        run: python3 scripts/fix-v15-syntax.py

      - name: Remove duplicate merchant domain helpers
        run: python3 scripts/fix-duplicate-merchant-domain.py

      - name: Apply v16 exact catalog UI
        run: |
          gzip -dc v16-ui.gz > scripts/apply-v16-ui.py
          python3 scripts/apply-v16-ui.py

      - name: Apply v16 bank card network strip
        run: python3 scripts/apply-v16-brand-strip.py

      - name: Add Internet permission
        run: |
          grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml || sed -i '/<manifest/a\    <uses-permission android:name="android.permission.INTERNET"/>' android/app/src/main/AndroidManifest.xml

      - name: Set Android NDK 27
        run: |
          sed -i 's/ndkVersion = flutter.ndkVersion/ndkVersion = "27.0.12077973"/' android/app/build.gradle.kts

      - name: Get dependencies
        run: flutter pub get

      - name: Check Supabase key
        env:
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "HATA: SUPABASE_PUBLISHABLE_KEY bulunamadi!"
            exit 1
          fi
          echo "Supabase publishable key mevcut."

      - name: Build APK
        env:
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          flutter build apk --release --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kart-kampanya-apk
          path: build/app/outputs/flutter-apk/app-release.apk
