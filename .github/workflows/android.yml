name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.32.8'
          cache: true

      - name: Backup app Dart files
        run: |
          if [ -d lib ]; then
            cp -a lib /tmp/kart_kampanya_lib
          fi

      - name: Create Android project
        run: flutter create --platforms=android .

      - name: Restore app Dart files
        run: |
          if [ -d /tmp/kart_kampanya_lib ]; then
            rm -rf lib
            cp -a /tmp/kart_kampanya_lib lib
          fi

      - name: Add Internet permission
        run: |
          sed -i '/<manifest/a\    <uses-permission android:name="android.permission.INTERNET"/>' android/app/src/main/AndroidManifest.xml

      - name: Set Android NDK 27
        run: |
          sed -i 's/ndkVersion = flutter.ndkVersion/ndkVersion = "27.0.12077973"/' android/app/build.gradle.kts

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        env:
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kart-kampanya-apk
          path: build/app/outputs/flutter-apk/app-release.apk
