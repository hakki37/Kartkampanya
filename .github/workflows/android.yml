name: Android APK - CLEAN CATALOG

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: stable
          cache: true
      - name: Prepare Flutter project
        run: flutter create --platforms=android .
      - name: Configure Google OAuth Android callback
        run: python3 scripts/configure-google-oauth-android.py
      - name: Dependencies
        run: flutter pub get
      - name: Remove generated sample test
        run: rm -rf test
      - name: Format Dart
        run: dart format lib
      - name: Analyze Dart
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Verify Google OAuth flow
        run: python3 scripts/verify-oauth-flow.py
      - name: Build APK
        run: flutter build apk --release
      - name: Verify APK artifact
        run: test -s build/app/outputs/flutter-apk/app-release.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kart-kampanya-clean-catalog-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="apk-build-${{ github.run_number }}"
          gh release create "$TAG" build/app/outputs/flutter-apk/app-release.apk \
            --repo "${{ github.repository }}" \
            --title "Kart Kampanya APK #${{ github.run_number }}" \
            --notes "Kart Kampanya Android APK build #${{ github.run_number }}" \
            --prerelease
