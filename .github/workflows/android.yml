name: Android APK - REFERENCE UI
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: stable
          cache: true
      - name: Prepare Flutter project
        run: flutter create --platforms=android .
      - name: Configure Google OAuth Android callback
        run: python3 scripts/configure-google-oauth-android.py
      - name: Apply reference UI
        run: python3 scripts/reference-ui-final.py
      - name: Repair reference UI Dart
        run: python3 scripts/repair-v32-reference-ui.py
      - name: Final syntax repair
        run: python3 scripts/fix-v31-clean-syntax.py
      - name: Lock reference visual theme
        run: python3 scripts/apply-reference-v40.py
      - name: Remove generated top-level braces
        run: python3 scripts/fix-top-level-braces.py
      - name: Final analysis cleanup
        run: python3 scripts/fix-v41-analysis.py
      - name: Lock reference bottom navigation
        run: python3 scripts/lock-bottom-nav-v42.py
      - name: Lock HTML reference login screen
        run: python3 scripts/lock-reference-login-v2.py
      - name: Remove duplicate login state
        run: python3 scripts/fix-login-state-duplicate-v44.py
      - name: Lock campaign bank and benefit details
        run: python3 scripts/lock-campaign-details-v43.py
      - name: Apply catalog campaign card layout
        run: python3 scripts/apply-v15-catalog-ui.py
      - name: Polish campaign benefit text and logos
        run: python3 scripts/apply-v16-catalog-polish.py
      - name: Open campaigns in detail view
        run: python3 scripts/fix-v18-robust.py
      - name: Use separate card selection screen
        run: python3 scripts/fix-v19-mycards-selection.py
      - name: Dependencies
        run: flutter pub get
      - name: Format Dart
        run: dart format lib/main.dart
      - name: Analyze Dart
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Ensure internet permission
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          permission = '    <uses-permission android:name="android.permission.INTERNET" />\n'
          if 'android.permission.INTERNET' not in s:
              s = s.replace('    <application', permission + '    <application', 1)
              p.write_text(s)
          PY
      - name: Finalize and validate OAuth manifest
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text(encoding='utf-8')
          activity_re = re.compile(
              r'<activity\b[^>]*android:name=["\'][^"\']*MainActivity["\'][^>]*>.*?</activity>',
              re.IGNORECASE | re.DOTALL,
          )
          activities = list(activity_re.finditer(s))
          if not activities:
              raise SystemExit('MainActivity not found')

          callback = '''\n            <intent-filter>\n                <action android:name="android.intent.action.VIEW" />\n                <category android:name="android.intent.category.DEFAULT" />\n                <category android:name="android.intent.category.BROWSABLE" />\n                <data android:scheme="io.supabase.flutter" android:host="login-callback" />\n            </intent-filter>'''

          first = activities[0].group(0)
          callback_re = re.compile(
              r'\s*<intent-filter>\s*<action android:name="android.intent.action.VIEW"\s*/>\s*'
              r'<category android:name="android.intent.category.DEFAULT"\s*/>\s*'
              r'<category android:name="android.intent.category.BROWSABLE"\s*/>\s*'
              r'<data android:scheme="io\.supabase\.flutter" android:host="login-callback"\s*/>\s*'
              r'</intent-filter>',
              re.IGNORECASE,
          )
          first = callback_re.sub('', first)
          first = first.replace('</activity>', callback + '\n        </activity>', 1)

          parts = []
          last = 0
          for i, match in enumerate(activities):
              parts.append(s[last:match.start()])
              if i == 0:
                  parts.append(first)
              last = match.end()
          parts.append(s[last:])
          s = ''.join(parts)
          p.write_text(s, encoding='utf-8')

          s = p.read_text(encoding='utf-8')
          activities = activity_re.findall(s)
          callbacks = re.findall(
              r'<data android:scheme="io\.supabase\.flutter" android:host="login-callback"\s*/>',
              s,
              re.IGNORECASE,
          )
          if len(activities) != 1:
              raise SystemExit(f'Expected exactly 1 MainActivity, found {len(activities)}')
          if len(callbacks) != 1:
              raise SystemExit(f'Expected exactly 1 Supabase callback data tag, found {len(callbacks)}')
          print('Final OAuth manifest valid: exactly one MainActivity and one Supabase callback')
          PY
      - name: Build APK
        run: flutter build apk --release
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kart-kampanya-reference-apk
          path: build/app/outputs/flutter-apk/app-release.apk
