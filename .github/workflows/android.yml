name: Android APK - CLEAN BUILD

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: stable
          cache: true

      - name: Prepare Flutter project
        run: flutter create --platforms=android .

      - name: Remove generated sample test
        run: rm -f test/widget_test.dart

      - name: Configure Android OAuth callback
        run: python3 scripts/configure-google-oauth-android.py

      - name: Repair campaign data and card matching
        run: python3 scripts/fix-card-match-and-campaign-data.py

      - name: Add Google OAuth login flow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/main.dart')
          s = p.read_text(encoding='utf-8')

          if 'signInWithOAuth(OAuthProvider.google' not in s:
              marker = '  Future<void> submit() async {'
              oauth = '''  Future<void> signInWithGoogle() async {
              setState(() {
                busy = true;
                error = null;
              });

              try {
                await Supabase.instance.client.auth.signInWithOAuth(
                  OAuthProvider.google,
                  redirectTo: 'io.supabase.flutter://login-callback/',
                  authScreenLaunchMode: LaunchMode.externalApplication,
                );
              } catch (e) {
                if (mounted) setState(() => error = e.toString());
              } finally {
                if (mounted) setState(() => busy = false);
              }
            }

'''
              if marker not in s:
                  raise SystemExit('submit marker not found')
              s = s.replace(marker, oauth + marker, 1)

          if "'Google ile Giriş Yap'" not in s:
              marker = "                TextButton(\n                  onPressed: busy"
              google = '''                const SizedBox(height: 8),

                SizedBox(
                  width: double.infinity,
                  child: OutlinedButton.icon(
                    onPressed: busy ? null : signInWithGoogle,
                    icon: const Icon(Icons.login),
                    label: const Text('Google ile Giriş Yap'),
                  ),
                ),

'''
              if marker not in s:
                  raise SystemExit('login toggle marker not found')
              s = s.replace(marker, google + marker, 1)

          s = s.replace(
              '    anonKey: AppConfig.supabasePublishableKey,',
              '    publishableKey: AppConfig.supabasePublishableKey,',
          )
          p.write_text(s, encoding='utf-8')
          print('Google OAuth login flow applied')
          PY

      - name: Dependencies
        run: flutter pub get

      - name: Apply Dart cleanup fixes
        run: dart fix --apply lib/main.dart

      - name: Format Dart
        run: dart format lib/main.dart

      - name: Analyze Dart
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Verify Google OAuth flow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          main = Path('lib/main.dart').read_text(encoding='utf-8')
          manifest = Path('android/app/src/main/AndroidManifest.xml').read_text(encoding='utf-8')
          required = [
              'signInWithOAuth(OAuthProvider.google',
              "redirectTo: 'io.supabase.flutter://login-callback/'",
              'authScreenLaunchMode: LaunchMode.externalApplication',
              "'Google ile Giriş Yap'",
              'onAuthStateChange',
              'currentSession',
          ]
          for item in required:
              if item not in main:
                  raise SystemExit(f'Missing Google OAuth requirement: {item}')
          for item in [
              'io.supabase.flutter',
              'login-callback',
              'android.intent.action.VIEW',
              'android.intent.category.BROWSABLE',
          ]:
              if item not in manifest:
                  raise SystemExit(f'Missing Android OAuth callback requirement: {item}')
          print('Google OAuth flow verified')
          PY

      - name: Ensure internet permission
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text(encoding='utf-8')
          permission = '    <uses-permission android:name="android.permission.INTERNET" />\n'
          if 'android.permission.INTERNET' not in s:
              s = s.replace('    <application', permission + '    <application', 1)
              p.write_text(s, encoding='utf-8')
          PY

      - name: Finalize OAuth manifest
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          path = Path('android/app/src/main/AndroidManifest.xml')
          ns = 'http://schemas.android.com/apk/res/android'
          ET.register_namespace('android', ns)
          root = ET.parse(path).getroot()
          app = next((e for e in root if e.tag == 'application'), None)
          if app is None:
              raise SystemExit('application not found')
          name = f'{{{ns}}}name'
          exported = f'{{{ns}}}exported'
          mains = [e for e in list(app) if e.tag == 'activity' and e.get(name, '').endswith('MainActivity')]
          if len(mains) != 1:
              raise SystemExit(f'Expected exactly one MainActivity, found {len(mains)}')
          main = mains[0]
          for child in list(main):
              if child.tag == 'intent-filter' and any(d.tag == 'data' and d.get(f'{{{ns}}}scheme') == 'io.supabase.flutter' and d.get(f'{{{ns}}}host') == 'login-callback' for d in child):
                  main.remove(child)
          main.set(exported, 'true')
          filt = ET.SubElement(main, 'intent-filter')
          ET.SubElement(filt, 'action', {f'{{{ns}}}name': 'android.intent.action.VIEW'})
          ET.SubElement(filt, 'category', {f'{{{ns}}}name': 'android.intent.category.DEFAULT'})
          ET.SubElement(filt, 'category', {f'{{{ns}}}name': 'android.intent.category.BROWSABLE'})
          ET.SubElement(filt, 'data', {f'{{{ns}}}scheme': 'io.supabase.flutter', f'{{{ns}}}host': 'login-callback'})
          ET.ElementTree(root).write(path, encoding='utf-8', xml_declaration=True)
          PY

      - name: Build APK
        run: flutter build apk --release

      - name: Verify APK artifact
        run: test -s build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kart-kampanya-clean-apk
          path: build/app/outputs/flutter-apk/app-release.apk
