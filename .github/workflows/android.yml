name: Android APK - CLEAN CATALOG

on:
  push:
    branches: [main, feature/app-links]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: stable
          cache: true
      - name: Prepare Flutter project
        run: flutter create --platforms=android .
      - name: Configure Google OAuth Android callback
        run: python3 scripts/configure-google-oauth-android.py
      - name: Configure Android core library desugaring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle.kts')
          s = p.read_text()
          marker = 'isCoreLibraryDesugaringEnabled = true'
          if marker not in s:
              s = s.replace('compileOptions {', 'compileOptions {\n        isCoreLibraryDesugaringEnabled = true', 1)
          if 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")' not in s:
              s += '\n\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'
          p.write_text(s)
          PY
      - name: Dependencies
        run: flutter pub get
      - name: Remove generated sample test
        run: rm -rf test
      - name: Format Dart
        run: dart format lib
      - name: Analyze Dart
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Verify Google OAuth flow
        run: python3 scripts/verify-oauth-flow.py
      - name: Build APK
        run: flutter build apk --release
      - name: Verify APK artifact
        run: test -s build/app/outputs/flutter-apk/app-release.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kart-kampanya-clean-catalog-apk
          path: build/app/outputs/flutter-apk/app-release.apk
