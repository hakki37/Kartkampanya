name: Android APK - REFERENCE UI
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: stable
          cache: true
      - name: Prepare Flutter project
        run: flutter create --platforms=android .
      - name: Configure Google OAuth Android callback
        run: python3 scripts/configure-google-oauth-android.py
      - name: Apply clean final catalog UI
        run: python3 scripts/apply-final-clean-ui.py
      - name: Ensure campaign detail anchor
        run: python3 scripts/ensure-campaign-detail-anchor.py
      - name: Repair final catalog UI syntax
        run: python3 scripts/repair-final-clean-ui.py
      - name: Restore card add screen
        run: python3 scripts/fix-v19-mycards-selection.py
      - name: Restore campaign detail and fix widget test
        run: python3 scripts/repair-campaign-detail-and-test.py
      - name: Repair campaign card Dart syntax
        run: python3 scripts/repair-campaign-card-syntax.py
      - name: Restore reference login and Google OAuth
        run: python3 scripts/lock-reference-login-v2.py
      - name: Repair duplicate login state
        run: python3 scripts/repair-duplicate-login-state.py
      - name: Restore tabbed card management page
        run: python3 scripts/fix-reference-mycards.py
      - name: Apply reference bottom navigation and card tabs
        run: python3 scripts/apply-v41-navigation-tabs.py
      - name: Apply exact reference campaign card UI
        run: python3 scripts/apply-reference-campaign-card.py
      - name: Repair generated UI symbols
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/main.dart')
          s = p.read_text(encoding='utf-8')

          def class_end(src, start):
              brace = src.find('{', start)
              depth = 0; quote = None; esc = False
              for i in range(brace, len(src)):
                  ch = src[i]
                  if quote:
                      if esc: esc = False
                      elif ch == '\\\\': esc = True
                      elif ch == quote: quote = None
                  elif ch in "'\"": quote = ch
                  elif ch == '{': depth += 1
                  elif ch == '}':
                      depth -= 1
                      if depth == 0: return i + 1
              raise SystemExit('unbalanced Dart class')

          # Keep the newest v41 MainShell and remove older duplicate definitions.
          positions = []
          pos = 0
          marker = 'class MainShell extends StatefulWidget {'
          while True:
              i = s.find(marker, pos)
              if i < 0: break
              positions.append(i); pos = i + 1
          for i in reversed(positions[:-1]):
              end = class_end(s, i)
              s = s[:i] + s[end:]

          # The v41 shell expects a ProfilePage; provide a small reference-style page.
          if 'class ProfilePage extends StatelessWidget' not in s:
              marker = 'class CategoriesPage extends StatelessWidget {'
              profile = '''class ProfilePage extends StatelessWidget {
            const ProfilePage({super.key});

            @override
            Widget build(BuildContext context) {
              final user = Supabase.instance.client.auth.currentUser;
              return Scaffold(
                backgroundColor: const Color(0xFFF8F7FC),
                appBar: AppBar(
                  title: const Text('Profil', style: TextStyle(fontWeight: FontWeight.w900)),
                ),
                body: ListView(
                  padding: const EdgeInsets.all(16),
                  children: [
                    Container(
                      padding: const EdgeInsets.all(20),
                      decoration: BoxDecoration(
                        color: Colors.white,
                        borderRadius: BorderRadius.circular(22),
                        border: Border.all(color: const Color(0xFFE3DDF0)),
                      ),
                      child: Row(children: [
                        const CircleAvatar(
                          radius: 28,
                          backgroundColor: Color(0xFFEDE5FF),
                          child: Icon(Icons.person_rounded, color: Color(0xFF6D3DF5), size: 30),
                        ),
                        const SizedBox(width: 14),
                        Expanded(child: Column(crossAxisAlignment: CrossAxisAlignment.start, children: [
                          const Text('Kart Kampanya', style: TextStyle(fontSize: 18, fontWeight: FontWeight.w900)),
                          Text(user?.email ?? '', maxLines: 1, overflow: TextOverflow.ellipsis, style: const TextStyle(color: Color(0xFF6D6677))),
                        ])),
                      ]),
                    ),
                    const SizedBox(height: 16),
                    SizedBox(
                      height: 50,
                      child: OutlinedButton.icon(
                        onPressed: () async => Supabase.instance.client.auth.signOut(),
                        icon: const Icon(Icons.logout_rounded),
                        label: const Text('Çıkış Yap', style: TextStyle(fontWeight: FontWeight.w800)),
                      ),
                    ),
                  ],
                ),
              );
            }
          }

          '''
              if marker not in s: raise SystemExit('CategoriesPage marker not found')
              s = s.replace(marker, profile + marker, 1)

          # Campaign card date formatting helper.
          if 'DateTime? parseCampaignDate(' not in s:
              helper = '''DateTime? parseCampaignDate(String value) {
            final text = value.trim();
            final direct = DateTime.tryParse(text);
            if (direct != null) return direct;
            final m = RegExp(r'(\\d{1,2})[./-](\\d{1,2})[./-](\\d{4})').firstMatch(text);
            if (m == null) return null;
            return DateTime.tryParse('${m.group(3)}-${m.group(2)!.padLeft(2, '0')}-${m.group(1)!.padLeft(2, '0')}');
          }

          '''
              s = s.replace('class UserCard {', helper + 'class UserCard {', 1)

          # MyCardsPage uses CatalogLogo for bank/network identity.
          if 'class CatalogLogo extends StatelessWidget' not in s:
              logo = '''class CatalogLogo extends StatelessWidget {
            final String label;
            const CatalogLogo({super.key, required this.label});

            String _domain() {
              final x = label.toLowerCase().replaceAll(' ', '');
              if (x == 'visa') return 'visa.com';
              if (x == 'mastercard') return 'mastercard.com';
              if (x == 'troy') return 'troy.com.tr';
              if (x.contains('akbank')) return 'akbank.com';
              if (x.contains('garanti')) return 'garantibbva.com.tr';
              if (x.contains('yapi') || x.contains('yapıkredi')) return 'yapikredi.com.tr';
              if (x.contains('isbank') || x.contains('işbank')) return 'isbank.com.tr';
              if (x.contains('qnb') || x.contains('cardfinans')) return 'qnb.com.tr';
              if (x.contains('teb')) return 'teb.com.tr';
              if (x.contains('ziraat')) return 'ziraatbank.com.tr';
              if (x.contains('halk')) return 'halkbank.com.tr';
              if (x.contains('vakif')) return 'vakifbank.com.tr';
              if (x.contains('deniz')) return 'denizbank.com';
              if (x.contains('ing')) return 'ing.com.tr';
              return '';
            }

            @override
            Widget build(BuildContext context) {
              final domain = _domain();
              if (domain.isEmpty) return Text(label, maxLines: 1, overflow: TextOverflow.ellipsis, style: const TextStyle(fontWeight: FontWeight.w800, fontSize: 11));
              return Image.network(
                'https://www.google.com/s2/favicons?domain=$domain&sz=128',
                width: 34,
                height: 34,
                fit: BoxFit.contain,
                errorBuilder: (_, __, ___) => Text(label, maxLines: 1, overflow: TextOverflow.ellipsis, style: const TextStyle(fontWeight: FontWeight.w800, fontSize: 11)),
              );
            }
          }

          '''
              s = s.replace('class UserCard {', logo + 'class UserCard {', 1)

          p.write_text(s, encoding='utf-8')
          print('Generated UI symbols repaired')
          PY
      - name: Dependencies
        run: flutter pub get
      - name: Format Dart
        run: dart format lib/main.dart
      - name: Analyze Dart
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Ensure internet permission
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text(encoding='utf-8')
          permission = '    <uses-permission android:name="android.permission.INTERNET" />\n'
          if 'android.permission.INTERNET' not in s:
              s = s.replace('    <application', permission + '    <application', 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Finalize OAuth manifest
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          path = Path('android/app/src/main/AndroidManifest.xml')
          ns = 'http://schemas.android.com/apk/res/android'
          ET.register_namespace('android', ns)
          root = ET.parse(path).getroot()
          app = next((e for e in root if e.tag == 'application'), None)
          if app is None: raise SystemExit('application not found')
          name = f'{{{ns}}}name'
          exported = f'{{{ns}}}exported'
          mains = [e for e in list(app) if e.tag == 'activity' and e.get(name, '').endswith('MainActivity')]
          if len(mains) != 1: raise SystemExit(f'Expected exactly one MainActivity, found {len(mains)}')
          main = mains[0]
          for child in list(main):
              if child.tag == 'intent-filter' and any(d.tag == 'data' and d.get(f'{{{ns}}}scheme') == 'io.supabase.flutter' and d.get(f'{{{ns}}}host') == 'login-callback' for d in child):
                  main.remove(child)
          main.set(exported, 'true')
          filt = ET.SubElement(main, 'intent-filter')
          ET.SubElement(filt, 'action', {f'{{{ns}}}name':'android.intent.action.VIEW'})
          ET.SubElement(filt, 'category', {f'{{{ns}}}name':'android.intent.category.DEFAULT'})
          ET.SubElement(filt, 'category', {f'{{{ns}}}name':'android.intent.category.BROWSABLE'})
          ET.SubElement(filt, 'data', {f'{{{ns}}}scheme':'io.supabase.flutter', f'{{{ns}}}host':'login-callback'})
          ET.ElementTree(root).write(path, encoding='utf-8', xml_declaration=True)
          print('OAuth manifest ready')
          PY
      - name: Verify Google OAuth flow
        run: python3 scripts/verify-oauth-flow.py
      - name: Build APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kart-kampanya-reference-apk
          path: build/app/outputs/flutter-apk/app-release.apk
