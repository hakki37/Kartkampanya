name: Android APK - CLEAN REFERENCE
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: stable
          cache: true
      - name: Prepare Flutter project
        run: flutter create --platforms=android .
      - name: Apply reference UI
        run: |
          python3 scripts/reference-ui-final.py
          python3 scripts/repair-reference-final.py
      - name: Sanitize generated Dart
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('lib/main.dart')
          s = p.read_text(encoding='utf-8')

          def class_end(src, start):
              brace = src.find('{', start)
              if brace < 0: raise SystemExit('class opening brace not found')
              depth = 0; quote = None; esc = False; line_comment = False; block_comment = False; i = brace
              while i < len(src):
                  ch = src[i]; nxt = src[i+1] if i + 1 < len(src) else ''
                  if line_comment:
                      if ch == '\n': line_comment = False
                  elif block_comment:
                      if ch == '*' and nxt == '/': block_comment = False; i += 1
                  elif quote:
                      if esc: esc = False
                      elif ch == '\\': esc = True
                      elif ch == quote: quote = None
                  else:
                      if ch == '/' and nxt == '/': line_comment = True; i += 1
                      elif ch == '/' and nxt == '*': block_comment = True; i += 1
                      elif ch in "'\"": quote = ch
                      elif ch == '{': depth += 1
                      elif ch == '}':
                          depth -= 1
                          if depth == 0: return i + 1
                  i += 1
              raise SystemExit('class closing brace not found')

          # Keep the first valid _HomeCat and remove later generated duplicates.
          marker = 'class _HomeCat extends StatelessWidget'
          first = s.find(marker)
          if first >= 0:
              pos = first
              while True:
                  nxt = s.find(marker, pos + 1)
                  if nxt < 0: break
                  end = class_end(s, nxt)
                  s = s[:nxt] + s[end:]
                  pos = nxt

          # Remove unmatched top-level closing braces left by the generator.
          out=[]; depth=0; quote=None; esc=False; line_comment=False; block_comment=False; i=0
          while i < len(s):
              ch=s[i]; nxt=s[i+1] if i+1<len(s) else ''
              if line_comment:
                  out.append(ch)
                  if ch=='\n': line_comment=False
              elif block_comment:
                  out.append(ch)
                  if ch=='*' and nxt=='/': out.append(nxt); i+=1; block_comment=False
              elif quote:
                  out.append(ch)
                  if esc: esc=False
                  elif ch=='\\': esc=True
                  elif ch==quote: quote=None
              else:
                  if ch=='/' and nxt=='/': out.extend([ch,nxt]); i+=1; line_comment=True
                  elif ch=='/' and nxt=='*': out.extend([ch,nxt]); i+=1; block_comment=True
                  elif ch in "'\"": out.append(ch); quote=ch
                  elif ch=='{': out.append(ch); depth+=1
                  elif ch=='}':
                      if depth>0: out.append(ch); depth-=1
                      else: print('removed unmatched top-level }')
                  else: out.append(ch)
              i+=1
          if depth != 0: raise SystemExit(f'unbalanced Dart braces remain: depth={depth}')
          s=''.join(out)
          p.write_text(s, encoding='utf-8')
          print('Dart sanitization complete')
          PY
      - name: Ensure internet permission
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          permission = '    <uses-permission android:name="android.permission.INTERNET" />\n'
          if 'android.permission.INTERNET' not in s:
              s = s.replace('    <application', permission + '    <application', 1)
              p.write_text(s)
          PY
      - name: Dependencies
        run: flutter pub get
      - name: Build APK
        run: flutter build apk --release
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kart-kampanya-final-reference-apk
          path: build/app/outputs/flutter-apk/app-release.apk
