name: Android APK - REFERENCE UI
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: stable
          cache: true
      - name: Prepare Flutter project
        run: flutter create --platforms=android .
      - name: Apply reference UI
        run: python3 scripts/reference-ui-final.py
      - name: Repair reference UI Dart
        run: python3 scripts/repair-v32-reference-ui.py
      - name: Final syntax repair
        run: python3 scripts/fix-v31-clean-syntax.py
      - name: Lock reference visual theme
        run: python3 scripts/apply-reference-v40.py
      - name: Remove generated top-level braces
        run: python3 scripts/fix-top-level-braces.py
      - name: Final analysis cleanup
        run: python3 scripts/fix-v41-analysis.py
      - name: Lock reference bottom navigation
        run: python3 scripts/lock-bottom-nav-v42.py
      - name: Lock HTML reference login screen
        run: python3 scripts/lock-reference-login-v2.py
      - name: Remove duplicate login state
        run: python3 scripts/fix-login-state-duplicate-v44.py
      - name: Dependencies
        run: flutter pub get
      - name: Format Dart
        run: dart format lib/main.dart
      - name: Analyze Dart
        run: flutter analyze --no-fatal-infos
      - name: Ensure internet permission
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          permission = '    <uses-permission android:name="android.permission.INTERNET" />\n'
          if 'android.permission.INTERNET' not in s:
              s = s.replace('    <application', permission + '    <application', 1)
              p.write_text(s)
          PY
      - name: Build APK
        run: flutter build apk --release
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kart-kampanya-reference-apk
          path: build/app/outputs/flutter-apk/app-release.apk
