name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.32.8'
          cache: true

      - name: Create Android project
        run: flutter create --platforms=android .

      - name: Install Kart Kampanya Dart files
        run: |
          mkdir -p lib

          if [ -f mainn.dart ]; then
            cp mainn.dart lib/main.dart
          elif [ -f main_v11_kampanya_kosullari_duzeltilmis.dart ]; then
            cp main_v11_kampanya_kosullari_duzeltilmis.dart lib/main.dart
          elif [ -f main.dart ]; then
            cp main.dart lib/main.dart
          else
            echo "HATA: Kart Kampanya main Dart dosyasi bulunamadi."
            echo "Repo kokundeki dosyalar:"
            ls -la
            exit 1
          fi

          if [ -f config.dart ]; then
            cp config.dart lib/config.dart
          fi

          echo "Kullanilan main.dart:"
          wc -l lib/main.dart
          head -n 5 lib/main.dart

      - name: Add Internet permission
        run: |
          sed -i '/<manifest/a\    <uses-permission android:name="android.permission.INTERNET"/>' android/app/src/main/AndroidManifest.xml

      - name: Set Android NDK 27
        run: |
          sed -i 's/ndkVersion = flutter.ndkVersion/ndkVersion = "27.0.12077973"/' android/app/build.gradle.kts

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        env:
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kart-kampanya-apk
          path: build/app/outputs/flutter-apk/app-release.apk
