name: Android APK - CLEAN REFERENCE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: stable
          cache: true

      - name: Prepare Flutter project
        run: flutter create --platforms=android .

      - name: Apply reference UI
        run: python3 scripts/retheme-v29.py

      - name: Ensure internet permission
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          permission = '    <uses-permission android:name="android.permission.INTERNET" />\n'
          if 'android.permission.INTERNET' not in s:
              s = s.replace('    <application', permission + '    <application', 1)
              p.write_text(s)
          PY

      - name: Dependencies
        run: flutter pub get

      - name: Verify Dart
        run: |
          dart format --output=none lib/main.dart
          flutter analyze --no-fatal-infos

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kart-kampanya-clean-reference-apk
          path: build/app/outputs/flutter-apk/app-release.apk
