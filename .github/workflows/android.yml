name: Android APK - REFERENCE UI
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: stable
          cache: true
      - name: Prepare Flutter project
        run: flutter create --platforms=android .
      - name: Apply reference UI
        run: python3 scripts/reference-ui-final.py
      - name: Repair reference UI Dart
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/main.dart')
          s = p.read_text(encoding='utf-8')

          def replace_class(src, name, replacement):
              start = src.find('class ' + name)
              if start < 0: raise SystemExit(name + ' not found')
              brace = src.find('{', start)
              depth = 0; quote = None; esc = False
              for i in range(brace, len(src)):
                  ch = src[i]
                  if quote:
                      if esc: esc = False
                      elif ch == '\\': esc = True
                      elif ch == quote: quote = None
                  elif ch in "'\"": quote = ch
                  elif ch == '{': depth += 1
                  elif ch == '}':
                      depth -= 1
                      if depth == 0: return src[:start] + replacement + src[i+1:]
              raise SystemExit(name + ' end not found')

          def replace_method(src, state_name, method_name, replacement):
              state = src.find('class ' + state_name)
              start = src.find('Widget ' + method_name, state)
              if start < 0: raise SystemExit(state_name + ' build not found')
              brace = src.find('{', start)
              depth = 0; quote = None; esc = False
              for i in range(brace, len(src)):
                  ch = src[i]
                  if quote:
                      if esc: esc = False
                      elif ch == '\\': esc = True
                      elif ch == quote: quote = None
                  elif ch in "'\"": quote = ch
                  elif ch == '{': depth += 1
                  elif ch == '}':
                      depth -= 1
                      if depth == 0: return src[:start] + replacement + src[i+1:]
              raise SystemExit(method_name + ' end not found')

          build = r'''Widget build(BuildContext context) {
            return Scaffold(
              backgroundColor: const Color(0xFFF8F7FC),
              body: FutureBuilder<List<Map<String, dynamic>>>(
                future: future,
                builder: (context, snapshot) {
                  var rows = snapshot.data ?? <Map<String, dynamic>>[];
                  if (search.text.trim().isNotEmpty) {
                    final q = _norm(search.text);
                    rows = rows.where((c) => _norm('${c['title'] ?? ''} ${c['merchant'] ?? ''} ${c['category'] ?? ''} ${c['description'] ?? ''}').contains(q)).toList();
                  }
                  if (category.isNotEmpty) rows = rows.where((c) => campaignSection(c) == category || '${c['category'] ?? ''}' == category).toList();
                  if (showFavoritesOnly) rows = rows.where((c) => favoriteIds.contains(campaignId(c))).toList();
                  if (widget.mode == 'matched' && widget.cards.isNotEmpty) rows = rows.where((c) => widget.cards.any((card) => cardMatches(c, card))).toList();
                  return RefreshIndicator(
                    onRefresh: () async { setState(() => future = fetchCampaigns()); await future; },
                    child: ListView(
                      padding: const EdgeInsets.fromLTRB(16, 14, 16, 30),
                      children: [
                        Row(children: [
                          Container(width: 42, height: 42, decoration: BoxDecoration(gradient: const LinearGradient(colors: [Color(0xFF8B5CF6), Color(0xFF5B21B6)]), borderRadius: BorderRadius.circular(13)), child: const Icon(Icons.credit_card_rounded, color: Colors.white)),
                          const SizedBox(width: 10),
                          const Expanded(child: Column(crossAxisAlignment: CrossAxisAlignment.start, children: [
                            Text('Kart Kampanya', style: TextStyle(fontSize: 20, fontWeight: FontWeight.w900, color: Color(0xFF211D2D))),
                            Text('Tüm Banka Kampanyaları Tek Uygulamada', style: TextStyle(fontSize: 10, color: Color(0xFF777187))),
                          ])),
                          IconButton(onPressed: () => setState(() => future = fetchCampaigns()), icon: const Icon(Icons.refresh_rounded)),
                        ]),
                        const SizedBox(height: 12),
                        TextField(controller: search, onChanged: (_) => setState(() {}), decoration: const InputDecoration(prefixIcon: Icon(Icons.search_rounded), hintText: 'Kampanya, marka veya kategori ara...')),
                        const SizedBox(height: 12),
                        if (widget.mode == 'home') Container(
                          padding: const EdgeInsets.all(18), height: 140,
                          decoration: BoxDecoration(gradient: const LinearGradient(colors: [Color(0xFF5424CF), Color(0xFF8C62F7)]), borderRadius: BorderRadius.circular(22)),
                          child: const Column(crossAxisAlignment: CrossAxisAlignment.start, children: [
                            Text('Yaz Fırsatları\nDevam Ediyor!', style: TextStyle(color: Colors.white, fontSize: 23, fontWeight: FontWeight.w900, height: 1.0)),
                            SizedBox(height: 8), Text('Alışverişte kazancını artır.', style: TextStyle(color: Colors.white, fontWeight: FontWeight.w700)),
                          ]),
                        ),
                        const SizedBox(height: 16),
                        const Text('Kampanyalar', style: TextStyle(fontSize: 19, fontWeight: FontWeight.w900, color: Color(0xFF211D2D))),
                        const SizedBox(height: 10),
                        if (snapshot.connectionState == ConnectionState.waiting) const Padding(padding: EdgeInsets.all(30), child: Center(child: CircularProgressIndicator())),
                        if (snapshot.hasError) const Padding(padding: EdgeInsets.all(30), child: Center(child: Text('Kampanyalar yüklenemedi.'))),
                        if (snapshot.connectionState != ConnectionState.waiting && !snapshot.hasError && rows.isEmpty) const Padding(padding: EdgeInsets.all(30), child: Center(child: Text('Kampanya bulunamadı.'))),
                        if (snapshot.connectionState != ConnectionState.waiting && !snapshot.hasError) ...rows.map((c) => SmartCampaignCard(campaign: c, isFavorite: favoriteIds.contains(campaignId(c)), isCompared: compareIds.contains(campaignId(c)), showAllCampaigns: showAllCampaigns, expiringSoon: isExpiringSoon(c), daysRemaining: daysLeft(c), onFavorite: () => toggleFavorite(c), onCompare: () => toggleCompare(c), onOpenUrl: openCampaignUrl, requiredSteps: requiredSteps(c), completedSteps: currentProgress(c), onProgressChange: (d) => changeProgress(c, d))),
                      ],
                    ),
                  );
                },
              ),
            );
          }
          '''
          s = replace_method(s, '_CampaignsPageState', 'build', build)

          categories = r'''class CategoriesPage extends StatelessWidget {
            const CategoriesPage({super.key});
            @override Widget build(BuildContext context) {
              const data = <List<dynamic>>[
                ['▦', 'Tümü', 0xFFEDE7FF], ['⛽', 'Akaryakıt', 0xFFFFE4E8], ['🛒', 'Market', 0xFFE1F8EF],
                ['🍴', 'Restoran', 0xFFFFEAD8], ['🛍', 'E-Ticaret', 0xFFE8E1FF], ['👕', 'Giyim', 0xFFFFE2F1],
                ['📱', 'Elektronik', 0xFFE1EEFF], ['✈', 'Seyahat', 0xFFFFE8D8], ['🚗', 'Otomotiv', 0xFFE3F0FF],
                ['⌂', 'Ev & Yaşam', 0xFFE3F4E9], ['💊', 'Sağlık & Güzellik', 0xFFFFE4EF], ['🎬', 'Eğlence', 0xFFE9E2FF],
              ];
              return ListView(padding: const EdgeInsets.fromLTRB(18, 18, 18, 30), children: [
                const Text('Kategoriler', style: TextStyle(fontSize: 28, fontWeight: FontWeight.w900, color: Color(0xFF211D2D))),
                const SizedBox(height: 16),
                GridView.builder(shrinkWrap: true, physics: const NeverScrollableScrollPhysics(), itemCount: data.length,
                  gridDelegate: const SliverGridDelegateWithFixedCrossAxisCount(crossAxisCount: 3, crossAxisSpacing: 10, mainAxisSpacing: 10, childAspectRatio: 1.05),
                  itemBuilder: (context, i) { final x = data[i]; return Container(decoration: BoxDecoration(color: Color(x[2] as int), borderRadius: BorderRadius.circular(18)), child: Column(mainAxisAlignment: MainAxisAlignment.center, children: [Text(x[0] as String, style: const TextStyle(fontSize: 25)), const SizedBox(height: 6), Padding(padding: const EdgeInsets.symmetric(horizontal: 5), child: Text(x[1] as String, maxLines: 2, textAlign: TextAlign.center, style: const TextStyle(fontSize: 10, fontWeight: FontWeight.w800, color: Color(0xFF353146))))])); },
                ),
              ]);
            }
          }
          '''
          s = replace_class(s, 'CategoriesPage', categories)
          p.write_text(s, encoding='utf-8')
          print('reference UI Dart repaired')
          PY
      - name: Dependencies
        run: flutter pub get
      - name: Format Dart
        run: dart format lib/main.dart
      - name: Analyze Dart
        run: flutter analyze --no-fatal-infos
      - name: Ensure internet permission
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          permission = '    <uses-permission android:name="android.permission.INTERNET" />\n'
          if 'android.permission.INTERNET' not in s:
              s = s.replace('    <application', permission + '    <application', 1)
              p.write_text(s)
          PY
      - name: Build APK
        run: flutter build apk --release
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kart-kampanya-reference-apk
          path: build/app/outputs/flutter-apk/app-release.apk
