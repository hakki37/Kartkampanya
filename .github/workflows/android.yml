name: Android APK - CLEAN REFERENCE
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: stable
          cache: true
      - name: Prepare Flutter project
        run: flutter create --platforms=android .
      - name: Apply final reference UI
        run: |
          python3 scripts/reference-ui-final.py
          python3 scripts/repair-reference-final.py
      - name: Repair generated Dart syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/main.dart')
          s = p.read_text(encoding='utf-8')

          def replace_method(src, cls, name, replacement):
              cs = src.find('class ' + cls)
              st = src.find('  @override\n  Widget ' + name, cs)
              if cs < 0 or st < 0: raise SystemExit(f'{cls}.{name} not found')
              b = src.find('{', st); depth = 0; quote = None; esc = False; i = b
              while i < len(src):
                  ch = src[i]
                  if quote:
                      if esc: esc = False
                      elif ch == '\\': esc = True
                      elif ch == quote: quote = None
                  elif ch in "'\"": quote = ch
                  elif ch == '{': depth += 1
                  elif ch == '}':
                      depth -= 1
                      if depth == 0: return src[:st] + replacement + src[i+1:]
                  i += 1
              raise SystemExit(name + ' end not found')

          def replace_class(src, cls, replacement):
              st = src.find('class ' + cls)
              if st < 0: raise SystemExit(cls + ' not found')
              b = src.find('{', st); depth = 0; quote = None; esc = False; i = b
              while i < len(src):
                  ch = src[i]
                  if quote:
                      if esc: esc = False
                      elif ch == '\\': esc = True
                      elif ch == quote: quote = None
                  elif ch in "'\"": quote = ch
                  elif ch == '{': depth += 1
                  elif ch == '}':
                      depth -= 1
                      if depth == 0: return src[:st] + replacement + src[i+1:]
                  i += 1
              raise SystemExit(cls + ' end not found')

          build = '''  @override
          Widget build(BuildContext context) {
            return Scaffold(
              backgroundColor: const Color(0xFFF8F7FC),
              body: FutureBuilder<List<Map<String, dynamic>>>(
                future: future,
                builder: (context, snapshot) {
                  var rows = snapshot.data ?? <Map<String, dynamic>>[];
                  if (search.text.trim().isNotEmpty) {
                    final q = _norm(search.text);
                    rows = rows.where((c) => _norm([c['title'], c['merchant'], c['category'], c['description'], c['campaign_text']].where((x) => x != null).join(' ')).contains(q)).toList();
                  }
                  if (category.isNotEmpty) rows = rows.where((c) => campaignSection(c) == category || '${c['category'] ?? ''}' == category).toList();
                  if (showFavoritesOnly) rows = rows.where((c) => favoriteIds.contains(campaignId(c))).toList();
                  if (widget.mode == 'matched' && widget.cards.isNotEmpty) rows = rows.where((c) => widget.cards.any((card) => cardMatches(c, card))).toList();
                  return RefreshIndicator(
                    onRefresh: () async { setState(() { future = fetchCampaigns(); }); await future; },
                    child: ListView(
                      padding: const EdgeInsets.fromLTRB(16, 14, 16, 30),
                      children: [
                        Row(children: [
                          Container(width: 42, height: 42, decoration: BoxDecoration(gradient: const LinearGradient(colors: [Color(0xFF8B5CF6), Color(0xFF5B21B6)]), borderRadius: BorderRadius.circular(13)), child: const Icon(Icons.credit_card_rounded, color: Colors.white)),
                          const SizedBox(width: 10),
                          const Expanded(child: Column(crossAxisAlignment: CrossAxisAlignment.start, children: [Text('Kart Kampanya', style: TextStyle(fontSize: 20, fontWeight: FontWeight.w900, color: Color(0xFF211D2D))), Text('Tüm Banka Kampanyaları Tek Uygulamada', style: TextStyle(fontSize: 10, color: Color(0xFF777187)))])),
                          IconButton(onPressed: () => setState(() { future = fetchCampaigns(); }), icon: const Icon(Icons.refresh_rounded)),
                        ]),
                        const SizedBox(height: 12),
                        TextField(controller: search, onChanged: (_) => setState(() {}), decoration: const InputDecoration(prefixIcon: Icon(Icons.search_rounded), hintText: 'Kampanya, marka veya kategori ara...')),
                        const SizedBox(height: 12),
                        if (widget.mode == 'home') ...[
                          Container(height: 142, padding: const EdgeInsets.all(17), decoration: BoxDecoration(gradient: const LinearGradient(colors: [Color(0xFF5424CF), Color(0xFF8C62F7)]), borderRadius: BorderRadius.circular(23)), child: const Column(crossAxisAlignment: CrossAxisAlignment.start, children: [Text('Yaz Fırsatları\\nDevam Ediyor!', style: TextStyle(color: Colors.white, fontSize: 23, height: 1.0, fontWeight: FontWeight.w900)), SizedBox(height: 8), Text('Kartına uygun kampanyaları keşfet.', style: TextStyle(color: Colors.white, fontSize: 12, fontWeight: FontWeight.w700)), Spacer(), Text('Tüm kampanyalar →', style: TextStyle(color: Colors.white, fontSize: 11, fontWeight: FontWeight.w900))])),
                          const SizedBox(height: 16),
                          const Text('Kategoriler', style: TextStyle(fontSize: 18, fontWeight: FontWeight.w900, color: Color(0xFF211D2D))),
                          const SizedBox(height: 9),
                          Wrap(spacing: 8, runSpacing: 8, children: const [_HomeCat('⛽', 'Akaryakıt', 0xFFFFE4E8), _HomeCat('🛒', 'Market', 0xFFE1F8EF), _HomeCat('🍴', 'Restoran', 0xFFFFEAD8), _HomeCat('🛍', 'E-Ticaret', 0xFFE8E1FF), _HomeCat('📱', 'Elektronik', 0xFFE1EEFF), _HomeCat('✈', 'Seyahat', 0xFFFFE8D8), _HomeCat('👕', 'Giyim', 0xFFFFE2F1), _HomeCat('⌂', 'Ev & Yaşam', 0xFFE3F4E9)]),
                          const SizedBox(height: 16),
                        ],
                        if (snapshot.connectionState == ConnectionState.waiting) const Padding(padding: EdgeInsets.all(40), child: Center(child: CircularProgressIndicator())),
                        if (snapshot.hasError) Padding(padding: const EdgeInsets.all(20), child: Text('Kampanyalar yüklenemedi: ${snapshot.error}', style: const TextStyle(color: Colors.red))),
                        if (snapshot.connectionState != ConnectionState.waiting && rows.isEmpty && !snapshot.hasError) const Padding(padding: EdgeInsets.all(30), child: Center(child: Text('Kampanya bulunamadı.', style: TextStyle(color: Color(0xFF777187))))),
                        for (final c in rows.take(widget.mode == 'home' ? 8 : rows.length))
                          Card(margin: const EdgeInsets.only(bottom: 10), color: Colors.white, shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(18)), child: Padding(padding: const EdgeInsets.all(14), child: Column(crossAxisAlignment: CrossAxisAlignment.start, children: [
                            Row(children: [Expanded(child: Text('${c['title'] ?? c['campaign_text'] ?? 'Kampanya'}', maxLines: 2, overflow: TextOverflow.ellipsis, style: const TextStyle(fontSize: 16, fontWeight: FontWeight.w900, color: Color(0xFF211D2D)))), IconButton(onPressed: () => setState(() { final id = campaignId(c); if (favoriteIds.contains(id)) { favoriteIds.remove(id); } else { favoriteIds.add(id); } }), icon: Icon(favoriteIds.contains(campaignId(c)) ? Icons.favorite : Icons.favorite_border, color: const Color(0xFF6D3DF5)))]),
                            if (c['merchant'] != null) Text('${c['merchant']}', style: const TextStyle(fontWeight: FontWeight.w700, color: Color(0xFF6D3DF5))),
                            const SizedBox(height: 6),
                            Text('${c['campaign_text'] ?? c['description'] ?? c['conditions'] ?? ''}', maxLines: 4, overflow: TextOverflow.ellipsis, style: const TextStyle(fontSize: 12, color: Color(0xFF55515F), height: 1.35)),
                            const SizedBox(height: 8),
                            Text(campaignSection(c), style: const TextStyle(fontSize: 10, fontWeight: FontWeight.w800, color: Color(0xFF777187))),
                          ]))),
                      ],
                    ),
                  );
                },
              ),
            );
          }
          '''
          s = replace_method(s, '_CampaignsPageState', 'build', build)

          cat = '''class CategoriesPage extends StatelessWidget {
            const CategoriesPage({super.key});
            static const items = [
              ['⛽','Akaryakıt',0xFFFFE4E8], ['🚗','Otomotiv',0xFFE3F0FF], ['🛒','Market',0xFFE1F8EF], ['🍴','Restoran',0xFFFFEAD8],
              ['🛍','E-Ticaret',0xFFE8E1FF], ['📱','Elektronik',0xFFE1EEFF], ['👕','Giyim',0xFFFFE2F1], ['🏠','Ev & Yaşam',0xFFE3F4E9],
              ['✈️','Seyahat',0xFFFFE8D8], ['🎬','Eğlence',0xFFEDE5FF], ['💊','Sağlık & Kişisel Bakım',0xFFFFE8F0], ['🏋️','Spor',0xFFE6F4FF],
              ['📚','Eğitim',0xFFFFF0D8], ['👶','Bebek & Çocuk',0xFFFFE5EC], ['🐾','Evcil Hayvan',0xFFE8F4E8], ['💼','Finans & Sigorta',0xFFE8E9FF],
            ];
            @override Widget build(BuildContext context) => ListView(padding: const EdgeInsets.fromLTRB(16,18,16,30), children: [
              const Text('Kategoriler', style: TextStyle(fontSize: 28, fontWeight: FontWeight.w900, color: Color(0xFF211D2D))),
              const SizedBox(height: 6), const Text('Kampanyaları kategoriye göre keşfet.', style: TextStyle(color: Color(0xFF777187))), const SizedBox(height: 16),
              GridView.builder(shrinkWrap: true, physics: const NeverScrollableScrollPhysics(), itemCount: items.length, gridDelegate: const SliverGridDelegateWithFixedCrossAxisCount(crossAxisCount: 3, crossAxisSpacing: 10, mainAxisSpacing: 10, childAspectRatio: 1), itemBuilder: (context,i) { final x=items[i]; return Container(decoration: BoxDecoration(color: Color(x[2] as int), borderRadius: BorderRadius.circular(20)), child: Column(mainAxisAlignment: MainAxisAlignment.center, children: [Text(x[0] as String, style: const TextStyle(fontSize: 27)), const SizedBox(height: 6), Padding(padding: const EdgeInsets.symmetric(horizontal: 4), child: Text(x[1] as String, maxLines: 2, textAlign: TextAlign.center, style: const TextStyle(fontSize: 10, fontWeight: FontWeight.w800, color: Color(0xFF353146))))])); }),
            ]);
          }
          '''
          s = replace_class(s, 'CategoriesPage', cat)

          if 'class _HomeCat extends StatelessWidget' in s:
              s = replace_class(s, '_HomeCat', '')
          s += '''
          
          class _HomeCat extends StatelessWidget {
            final String icon, label;
            final int bg;
            const _HomeCat(this.icon, this.label, this.bg);
            @override Widget build(BuildContext context) => Container(width: 78, height: 78, decoration: BoxDecoration(color: Color(bg), borderRadius: BorderRadius.circular(16)), child: Column(mainAxisAlignment: MainAxisAlignment.center, children: [Text(icon, style: const TextStyle(fontSize: 20)), const SizedBox(height: 3), Text(label, maxLines: 1, overflow: TextOverflow.ellipsis, style: const TextStyle(fontSize: 9, color: Color(0xFF353146), fontWeight: FontWeight.w800))]));
          }
          '''
          p.write_text(s, encoding='utf-8')
          print('generated Dart syntax repaired')
          PY
      - name: Ensure internet permission
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          permission = '    <uses-permission android:name="android.permission.INTERNET" />\n'
          if 'android.permission.INTERNET' not in s:
              s = s.replace('    <application', permission + '    <application', 1)
              p.write_text(s)
          PY
      - name: Dependencies
        run: flutter pub get
      - name: Build APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kart-kampanya-final-reference-apk
          path: build/app/outputs/flutter-apk/app-release.apk
