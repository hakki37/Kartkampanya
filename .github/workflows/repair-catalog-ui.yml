name: Repair catalog UI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply UI repair
        run: python3 scripts/repair-catalog-ui.py

      - name: Commit repaired UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No UI changes needed."
          else
            git add lib/main.dart
            git commit -m "Repair catalog UI layout and navigation"
            git push
          fi
